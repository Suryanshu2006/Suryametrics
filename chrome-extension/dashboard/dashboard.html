<!DOCTYPE html>
<html>
<head>
  <title>Weekly Productivity Dashboard</title>
  <script src="chart.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.4);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      font-size: 36px;
      margin-bottom: 40px;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .summary {
      display: flex;
      justify-content: space-around;
      margin-bottom: 40px;
      gap: 20px;
    }

    .summary-item {
      flex: 1;
      text-align: center;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px 20px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .summary-item:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
      border-color: rgba(255,255,255,0.2);
    }

    .summary-item h3 { margin: 0; font-size: 14px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; font-weight: 600;}
    .summary-item p { margin: 15px 0 0 0; font-size: 36px; font-weight: 700; color: var(--text); }
    #prodScore { background: linear-gradient(to right, #10b981, #34d399); background-clip: text; -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    .charts { display: flex; gap: 30px; flex-wrap: wrap; }
    .chart-box {
      flex: 1;
      min-width: 450px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 25px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      transition: transform 0.3s;
    }
    .chart-box:hover { border-color: rgba(255,255,255,0.2); }
    
  </style>
</head>
<body>
  <div class="container">
    <h1>Weekly Productivity Analytics</h1>
    
    <div class="summary">
      <div class="summary-item">
        <h3>Total Time Tracked</h3>
        <p id="totalTime">0h 0m</p>
      </div>
      <div class="summary-item">
        <h3>Productivity Score</h3>
        <p id="prodScore">0%</p>
      </div>
    </div>

    <div class="charts">
      <div class="chart-box">
        <canvas id="pieChart"></canvas>
      </div>
      <div class="chart-box">
        <canvas id="barChart"></canvas>
      </div>
    </div>
  </div>
  <script src="dashboard.js"></script>
</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
    
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --border: rgba(255, 255, 255, 0.1);
      --primary: #3b82f6;
      --success: #10b981;
      --danger: #ef4444;
    }

    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 40px 20px;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 30px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
    }

    h1 {
      text-align: center;
      margin-top: 0;
      font-size: 28px;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 30px;
      font-weight: 700;
    }

    .section { margin-bottom: 30px; }
    h2 { font-size: 18px; margin-bottom: 15px; color: #e2e8f0; border-bottom: 1px solid var(--border); padding-bottom: 10px; font-weight: 600;}
    
    .add-form { display: flex; gap: 10px; margin-bottom: 15px; }
    .add-form input { flex: 1; padding: 12px 15px; background: rgba(0,0,0,0.2); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: 14px; outline: none; transition: border 0.2s; }
    .add-form input:focus { border-color: var(--primary); }
    .add-form button { background: linear-gradient(135deg, var(--success), #059669); color: white; border: none; padding: 0 20px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 4px 12px rgba(16, 185, 129, 0.2); }
    .add-form button:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(16, 185, 129, 0.3); }

    ul { list-style: none; padding: 0; margin: 0; }
    li { background: rgba(255,255,255,0.03); padding: 12px 15px; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; border-radius: 8px; border: 1px solid rgba(255,255,255,0.05); transition: all 0.2s; }
    li:hover { background: rgba(255,255,255,0.06); border-color: var(--border); }
    button.remove { background: rgba(239, 68, 68, 0.1); color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 12px; cursor: pointer; border-radius: 6px; font-weight: 500; transition: all 0.2s; font-family: inherit;}
    button.remove:hover { background: var(--danger); color: white; border-color: var(--danger); }
  </style>
</head>
<body>
  <div class="container">
    <h1>Domain Classifications</h1>
    <div class="section">
      <h2>Productive Domains</h2>
      <div class="add-form">
        <input type="text" id="prodInput" placeholder="e.g., myworksite.com">
        <button id="addProdBtn">Add</button>
      </div>
      <ul id="prodList"></ul>
    </div>

    <div class="section">
      <h2>Unproductive Domains</h2>
      <div class="add-form">
        <input type="text" id="unprodInput" placeholder="e.g., fun-games.com">
        <button id="addUnprodBtn">Add</button>
      </div>
      <ul id="unprodList"></ul>
    </div>
  </div>
  <script src="options.js"></script>
</body>
</html>

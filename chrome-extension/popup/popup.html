<!DOCTYPE html>
<html>
<head>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap');
    
    :root {
      --bg: #0f172a;
      --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #2563eb;
      --prod: #10b981;
      --unprod: #ef4444;
      --border: rgba(255, 255, 255, 0.1);
    }

    body {
      width: 320px;
      margin: 0;
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
      color: var(--text);
      padding: 20px;
      box-sizing: border-box;
      backdrop-filter: blur(10px);
    }

    h2 {
      margin: 0 0 20px 0;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      background: linear-gradient(to right, #60a5fa, #a78bfa);
      background-clip: text;
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .stats {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 20px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -2px rgba(0, 0, 0, 0.1);
    }

    .stat-row {
      display: flex;
      justify-content: space-between;
      margin-bottom: 12px;
      font-size: 14px;
      font-weight: 600;
    }
    .stat-row:last-child { margin-bottom: 0; }
    .stat-row span:first-child { color: var(--text-muted); font-weight: 400; }

    .productive { color: var(--prod); text-shadow: 0 0 8px rgba(16, 185, 129, 0.4); }
    .unproductive { color: var(--unprod); text-shadow: 0 0 8px rgba(239, 68, 68, 0.4); }

    button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      cursor: pointer;
      background: var(--card-bg);
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: 8px;
      font-family: inherit;
      font-size: 14px;
      font-weight: 600;
      transition: all 0.2s ease;
      position: relative;
    }
    
    button#dashboardBtn {
      background: linear-gradient(135deg, var(--primary), #6366f1);
      border: none;
      box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
    }

    button:hover {
      transform: translateY(-1px);
      box-shadow: 0 6px 16px rgba(0, 0, 0, 0.2);
      border-color: rgba(255,255,255,0.3);
    }
    
    button#dashboardBtn:hover {
      background: linear-gradient(135deg, var(--primary-hover), #4f46e5);
      box-shadow: 0 6px 16px rgba(59, 130, 246, 0.4);
    }
  </style>
</head>
<body>
  <h2>Today's Productivity</h2>
  <div class="stats" id="statsContainer">
    Loading...
  </div>
  <button id="dashboardBtn">View Weekly Dashboard</button>
  <button id="optionsBtn">Manage Classifications</button>
  <script src="popup.js"></script>
</body>
</html>
